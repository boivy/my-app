<section class="exercise">
  <h2>Exercise 13: Json Array Model – Product Event</h2>
  <table>
    <thead>
      <tr><th>Product ID</th><th>Product Name</th><th>Unit Price</th><th>Picture</th><th>#</th></tr>
    </thead>
    <tbody>
      @for (p of products; track p.ProductId) {
        <tr>
          <td>{{ p.ProductId }}</td><td>{{ p.ProductName }}</td><td>{{ p.Price }}</td>
          <td><img [src]="p.Image" [alt]="p.ProductName" /></td>
          <td><button type="button" (click)="viewDetail(p)">Details</button></td>
        </tr>
      }
    </tbody>
  </table>
</section>
