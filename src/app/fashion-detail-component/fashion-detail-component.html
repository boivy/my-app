<div class="journal detail">
  <a routerLink="/fashion-list">← Tất cả bài viết</a>
  <form class="lookup" (submit)="$event.preventDefault(); searchFashion(fashionId.value)">
    <label for="fashionLookup">Tìm bằng slug hoặc ObjectId</label>
    <input id="fashionLookup" #fashionId placeholder="sac-mau-tren-pho-1" required>
    <button type="submit">Tìm Fashion</button>
  </form>
  @if(errMessage()){<p role="alert">{{errMessage()}}</p>}
  @if(fashion(); as item){
    <article>
      <p class="kicker">{{item.style}} / #{{item.IdF}}</p>
      <h1>{{item.fashion_subject}}</h1>
      <p class="meta">{{item.createdAt | date:'dd.MM.yyyy'}}</p>
      <img class="cover" [src]="item.getBase64String()" [alt]="item.fashion_subject">
      <div class="article-body" [innerHTML]="item.fashion_detail"></div>
    </article>
  }
</div>
