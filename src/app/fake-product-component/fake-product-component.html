<p>fake-product works!</p>

@if (errMessage()) {
  <div class="alert alert-danger">{{ errMessage() }}</div>
}

<h3 class="text-center text-white bg-dark p-3">Product List</h3>

<div class="container my-4">
  <div class="row g-4">
    @for (p of products(); track p.id) {
      <div class="col-md-4">
        <div class="card h-100 shadow-sm">
          <div class="img-container">
            <div class="d-flex justify-content-between align-items-center p-2 first">
              <span class="percent">-25%</span>
              <span class="wishlist"><i class="bi bi-heart-fill text-danger"></i></span>
            </div>

            <div class="text-center p-3">
              <!-- Sửa src thành Property Binding [src] -->
              <img [src]="p.image" [alt]="p.title" class="img-fluid img-scale" style="max-height: 200px; object-fit: contain;">
            </div>
          </div>

          <div class="product-detail-container p-3 d-flex flex-column justify-content-between">
            <div>
              <div class="d-flex justify-content-between align-items-center">
                <h6 class="mb-2 text-truncate" [title]="p.title">{{ p.title }}</h6>
              </div>

              <div>
                <span class="text-danger fw-bold fs-5">${{ p.price }}</span>
              </div>

              <!-- Thêm ?. để chống lỗi lồng object rating -->
              <div class="d-flex justify-content-between align-items-center mt-2 text-muted small">
                <div class="ratings text-warning">
                  <i class="bi bi-star-fill me-1"></i>
                  <span class="text-dark">{{ p.rating?.rate }}</span>
                </div>

                <div class="count">
                  Count: {{ p.rating?.count }}
                </div>
              </div>
            </div>

            <div class="mt-3">
              <button class="btn btn-warning d-block w-100 text-white fw-bold">
                Buy Now
              </button>
            </div>
          </div>
        </div>
      </div>
    }
  </div>
</div>
